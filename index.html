function vTask(){let T=S.tasks.filter(t=>(!F.s||t.s===F.s)&&(!F.st||t.st===F.st)&&(!F.pr||t.pr==F.pr)&&(!F.q||(t.desc+t.note+t.t+t.s).toLowerCase().includes(F.q.toLowerCase())));
T.sort((a,b)=>(a.st==='Виконано')-(b.st==='Виконано')||(F.o==='due'?(a.due||'9').localeCompare(b.due||'9'):a.pr-b.pr));
const today=iso(new Date()),N=Math.max(1,subjects().length);
const opt=(a,v,all)=>`<option value="">${all}</option>`+a.map(x=>`<option ${String(x)===String(v)?'selected':''}>${esc(x)}</option>`).join('');
return`<div class="top"><h2>Завдання</h2><button class="btn p" data-a="tnew">+ Нове</button></div>
<div class="filters"><input id="fq" placeholder="Пошук…" value="${esc(F.q)}"><select data-f="s">${opt(subjects(),F.s,'Усі предмети')}</select><select data-f="st">${opt(STAT,F.st,'Усі статуси')}</select><select data-f="pr">${opt([...Array(N)].map((_,i)=>i+1),F.pr,'Будь-який пріоритет')}</select><select data-f="o"><option value="pr">За пріоритетом</option><option value="due" ${F.o==='due'?'selected':''}>За дедлайном</option></select></div>
<div class="grid">${T.map(t=>`<div class="card ${t.st==='Виконано'?'done':''}"><div class="row"><div class="pr">${t.pr}</div><div style="flex:1"><b>${esc(t.s)}</b> <span class="chip">${esc(t.t)}</span><div>${esc(t.desc)}${t.v?' · вар. '+esc(t.v):''}</div><div class="mut">Задано ${t.given||'—'} · <span class="${t.due&&t.due<today&&t.st!=='Виконано'?'late':''}">здати ${t.due||'—'}</span></div>${t.note?`<div class="mut">${esc(t.note)}</div>`:''}</div></div>
<div class="row" style="margin-top:8px"><button class="btn s" data-a="cyc" data-i="${t.id}">${t.st}</button><button class="btn s" data-a="tedit" data-i="${t.id}">Редагувати</button><button class="btn s" data-a="tdel" data-i="${t.id}">✕</button></div></div>`).join('')||'<div class="card mut">Завдань немає</div>'}</div>`}
function tform(t){const N=Math.max(1,subjects().length),sb=subjects();t=t||{id:'',s:sb[0]||'',t:TT[0],desc:'',v:'',given:iso(new Date()),due:'',st:STAT[0],pr:Math.ceil(N/2),note:'',auto:true};
const o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
$('#m').innerHTML=`<div class="modal"><div><h3>${t.id?'Завдання':'Нове завдання'}</h3><input type="hidden" id="t_id" value="${t.id}">
<label>Дисципліна</label><select id="t_s">${o(sb,t.s)}</select><div class="f2"><div><label>Тип робіт</label><select id="t_t">${o(TT,t.t)}</select></div><div><label>Варіант</label><input id="t_v" value="${esc(t.v)}"></div></div>
<label>№ роботи / сторінка / вправа / опис</label><input id="t_d" value="${esc(t.desc)}"><div class="f2"><div><label>Задано</label><input type="date" id="t_g" value="${t.given}"></div><div><label>Здати (порожньо = авто за розкладом)</label><input type="date" id="t_u" value="${t.due}"></div></div>
<div class="f2"><div><label>Статус</label><select id="t_st">${o(STAT,t.st)}</select></div><div><label>Пріоритет (1 — найвищий)</label><select id="t_p">${o([...Array(N)].map((_,i)=>i+1),t.pr)}</select></div></div>
<label>Нотатки</label><textarea id="t_n" rows="3">${esc(t.note)}</textarea><div class="row" style="margin-top:12px"><button class="btn p" data-a="tsave">Зберегти</button><button class="btn" data-a="mclose">Скасувати</button></div></div></div>`}
function vTL(){const t=iso(new Date()),s0=pd('2026-09-01');
return`<div class="top"><h2>Графік освітнього процесу</h2></div><div class="card">${sp()}</div><div class="card mut">${Object.entries(TLN).map(([k,v])=>`<span class="cd c${k}" style="display:inline-block;min-width:30px">${k}</span> ${v}`).join(' &nbsp; ')}<br>1 курс магістратури (1м), 2026/27. Розшифровки «ТР» у PDF немає.</div>
<div class="card">${TL.map((c,i)=>{const a=new Date(s0.getTime()+i*7*MS),b=new Date(a.getTime()+6*MS),now=t>=iso(a)&&t<=iso(b),e=c==='.';const f=d=>p2(d.getDate())+'.'+p2(d.getMonth()+1);return`<div class="wk ${now?'now':''}"><span class="mut">${i+1}</span><span>${f(a)} – ${f(b)}${i===4?' · <b>початок занять</b>':''}${i===23?' · <b>2-й семестр</b>':''}</span><span class="cd ${e?'cE':'c'+c}">${e?'—':c}</span></div>`}).join('')}</div>`}
let po={1:1};document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.sem)po[e.target.dataset.sem]=e.target.open},true);
function planArr(i){let p=S.plan[i];if(typeof p==='string')p=p.split('\n').filter(x=>x.trim()).map(x=>({n:x.trim(),f:'Іспит'}));return S.plan[i]=Array.isArray(p)?p:[]}
let edP=0,edG=0;
function vPlan(){return`<div class="top"><h2>Навчальний план</h2><button class="btn ${edP?'p':''}" data-a="edp">${edP?'Готово':'Редагувати'}</button></div>`+SEMN.map((n,i)=>{const P=planArr(i+1),ex=P.filter(r=>r.f==='Іспит').length;return`<details class="card" data-sem="${i+1}" ${po[i+1]?'open':''}><summary><b>Семестр ${n}</b> <span class="mut">${P.length} дисц. · ${ex} іспит(и), ${P.length-ex} залік(и)</span></summary><div class="pl">${P.map((r,k)=>edP?`<div class="gr"><span class="nm">${k+1}</span><input data-pn="${i+1}.${k}" value="${esc(r.n)}" placeholder="Назва дисципліни"><select data-pf="${i+1}.${k}"><option ${r.f==='Іспит'?'selected':''}>Іспит</option><option ${r.f==='Залік'?'selected':''}>Залік</option></select><button class="x" data-a="pdel" data-i="${i+1}.${k}">✕</button></div>`:`<div class="gr rd"><span class="nm">${k+1}</span><span>${esc(r.n)}</span><span class="chip ${r.f==='Іспит'?'Пз':'Лб'}">${r.f}</span></div>`).join('')||'<div class="mut">Дисциплін ще немає</div>'}</div>${edP?`<button class="btn s" data-a="padd" data-i="${i+1}">+ Додати дисципліну</button>`:''}</details>`}).join('')}
function vGrp(){const n=S.grp.filter(x=>x.trim()).length;return`<div class="top"><h2>Група <span class="mut">${n} із ${S.grp.length}</span></h2><div>${edG?'':'<button class="btn" data-a="cpg">Копіювати</button> '}<button class="btn ${edG?'p':''}" data-a="edg">${edG?'Готово':'Редагувати'}</button></div></div><div class="card"><div class="gl">${S.grp.map((x,i)=>edG?`<div class="gr"><span class="nm">${i+1}</span><input data-g="${i}" value="${esc(x)}" placeholder="Прізвище Ім'я По батькові"><button class="x" data-a="gdel" data-i="${i}">✕</button></div>`:`<div class="gr rd"><span class="nm">${i+1}</span><span>${x.trim()?esc(x):'<span class="mut">—</span>'}</span></div>`).join('')}</div>${edG?'<button class="btn" data-a="gadd" style="margin-top:10px">+ Додати рядок</button>':''}</div>`}
function vSet(){return`<div class="top"><h2>Ще</h2><button class="btn" data-a="theme">Тема: ${S.theme==='dark'?'темна':S.theme==='light'?'світла':'авто'}</button></div>
<div class="card"><h3>Посилання на Meet/Zoom</h3>${subjects().map(s=>`<label>${esc(s)}</label><div class="f2"><input data-sf="full" data-s="${esc(s)}" placeholder="Повна назва (необов'язково)" value="${esc((S.subj[s]||{}).full||'')}"><input data-sf="link" data-s="${esc(s)}" placeholder="https://meet…" value="${esc((S.subj[s]||{}).link||'')}"></div>`).join('')}</div>
<div class="card"><h3>Імпорт розкладу</h3><p class="mut">Файл з порталу (.xls/.xlsx/.csv). Дати з файлу замінюють старі пари за ті ж дати. Якщо з'явиться помилка — вона покаже причину.</p><input type="file" id="fx" accept=".xls,.xlsx,.csv"><label>Чисельник починається з понеділка</label><input type="date" id="anc" value="${S.anchor}"></div>
<div class="card"><h3>Резервна копія</h3><div class="row"><button class="btn" data-a="exp">Експорт JSON</button><label class="btn" style="margin:0">Імпорт JSON<input type="file" id="fj" accept=".json" hidden></label></div></div>`}
function parseRows(R){const out=[];let ds=null;for(const r of R){const a=String(r[0]||'').trim();
if(/^(Пн|Вт|Ср|Чт|Пт|Сб|Нд)$/.test(a)){ds=r.slice(1).map(x=>{const m=String(x).match(/(\d\d)\.(\d\d)\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:''});continue}
const m=a.match(/(\d+)\s*пара[\s|]*(\d\d:\d\d)\s*-\s*(\d\d:\d\d)/);if(!m||!ds)continue;
r.slice(1).forEach((c,j)=>{c=String(c||'').trim();if(!c||!ds[j])return;const pt=c.split(/\n|\|/).map(x=>x.trim()),n=pt[0].match(/^(?:ОК\s+)?(.+?)\s*\[(.+?)\]/);if(!n)return;
out.push({d:ds[j],p:+m[1],a:m[2],b:m[3],s:n[1].trim(),k:n[2].trim(),r:(pt[1]||'').replace('ауд.','').trim(),t:pt[2]||''})})}return out}
const sh=()=>{const e=$('#v').querySelector('#fx');};
function render(){const nm={sch:'Розклад',task:'Завдання',tl:'Графік',plan:'План',grp:'Група',set:'Ще'};
$('#nav').innerHTML=Object.entries(nm).map(([k,v])=>`<button data-a="tab" data-t="${k}" class="${tab===k?'on':''}">${v}</button>`).join('');
$('#v').innerHTML={sch:vSch,task:vTask,tl:vTL,plan:vPlan,grp:vGrp,set:vSet}[tab]()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a==='tab'){tab=b.dataset.t;render()}else if(a==='go'){day=b.dataset.d;render()}
else if(a==='wk'){const d=pd(day);d.setDate(d.getDate()+ +b.dataset.n);day=iso(d);render()}
else if(a==='theme'){S.theme=S.theme===''?'light':S.theme==='light'?'dark':'';setTheme();save();render()}
else if(a==='tnew')tform();else if(a==='tedit')tform(S.tasks.find(t=>t.id===i));else if(a==='mclose')$('#m').innerHTML='';
else if(a==='tdel'){if(b.dataset.sure){S.tasks=S.tasks.filter(t=>t.id!==i);save();render()}else{b.dataset.sure=1;b.textContent='Видалити?';setTimeout(()=>{b.dataset.sure='';b.textContent='✕'},3000)}}
else if(a==='edp'){if(edP)for(let s=1;s<=4;s++)S.plan[s]=planArr(s).filter(r=>r.n.trim());edP=!edP;save();render()}else if(a==='edg'){edG=!edG;save();render()}
else if(a==='padd'){planArr(+i).push({n:'',f:'Іспит'});save();render()}else if(a==='pdel'){const[s,k]=i.split('.');planArr(+s).splice(+k,1);save();render()}
else if(a==='gadd'){S.grp.push('');save();render()}else if(a==='gdel'){S.grp.splice(+i,1);save();render()}
else if(a==='cyc'){const t=S.tasks.find(t=>t.id===i);t.st=STAT[(STAT.indexOf(t.st)+1)%3];save();render()}
else if(a==='tsave'){const g=x=>$('#t_'+x).value,o={id:g('id')||'t'+Date.now(),s:g('s'),t:g('t'),v:g('v'),desc:g('d'),given:g('g'),due:g('u'),st:g('st'),pr:+g('p'),note:g('n')};
if(!o.due){const l=nextL(o.s,o.given,kindOf(o.t));if(l)o.due=l.d}
const k=S.tasks.findIndex(t=>t.id===o.id);k<0?S.tasks.push(o):S.tasks[k]=o;save();$('#m').innerHTML='';render()}
else if(a==='cpg'){const tx=S.grp.filter(x=>x.trim()).map((x,n)=>(n+1)+'. '+x.trim()).join('\n');let ok=false;try{navigator.clipboard.writeText(tx);ok=true}catch(x){}if(!ok){const a=document.createElement('textarea');a.value=tx;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}toast('Скопійовано ✓')}
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='planner-backup.json';l.click()}});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='fq'){F.q=t.value;const p=t.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)}
else if(t.dataset.f){F[t.dataset.f]=t.value;render()}
else if(t.dataset.pn||t.dataset.pf){const[s,k]=(t.dataset.pn||t.dataset.pf).split('.'),r=planArr(+s)[+k];if(t.dataset.pn)r.n=t.value;else r.f=t.value;save()}
else if(t.dataset.g!==undefined){S.grp[+t.dataset.g]=t.value;save()}
else if(t.dataset.sf){const s=t.dataset.s;(S.subj[s]=S.subj[s]||{})[t.dataset.sf]=t.value;save()}
else if(t.id==='anc'){S.anchor=t.value;save()}});
document.addEventListener('change',async e=>{const t=e.target;if(!t.files||!t.files[0])return;const f=t.files[0];
if(t.id==='fj'){try{Object.assign(S,JSON.parse(await f.text()));save();render()}catch(x){toast('Не вдалося прочитати JSON',5000)}}
if(t.id==='fx'){try{if(typeof XLSX==='undefined')throw new Error('бібліотека XLSX не завантажилась (потрібен інтернет)');const buf=await f.arrayBuffer();let wb;try{wb=XLSX.read(buf,{type:'array'})}catch(x){wb=XLSX.read(new Uint8Array(buf).reduce((s,c)=>s+String.fromCharCode(c),''),{type:'binary'})}
const R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}),L=parseRows(R);if(!L.length)throw new Error('пар у файлі не знайдено');const ds=new Set(L.map(l=>l.d));S.lessons=S.lessons.filter(l=>!ds.has(l.d)).concat(L);save();render();toast('Імпортовано пар: '+L.length,4000)}catch(x){toast('Помилка імпорту: '+(x&&x.message||x),7000)}}
t.value=''});
setInterval(()=>{if(tab==='sch'&&day===iso(new Date())&&!$('#m').innerHTML)render()},60000);render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
